
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leduc-poker-dream-experiments"
version = "0.1.0"
description = "DREAM-style Leduc poker experiments for an MPhil thesis"
requires-python = ">=3.9,<3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["dream_poker*", "experiments*"]
exclude = ["gcp*", "notebooks*", "outputs*", "tests*", "thesis_artifacts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
